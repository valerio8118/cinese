const $=id=>document.getElementById(id);
const can='speechSynthesis' in window;
let ZV=null;const pick=()=>{ZV=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang))||null};
if(can){pick();speechSynthesis.onvoiceschanged=pick}
function say(z){if(!can)return;
 const go=()=>{const u=new SpeechSynthesisUtterance(z);u.lang='zh-CN';if(ZV)u.voice=ZV;u.rate=.8;speechSynthesis.resume();speechSynthesis.speak(u)};
 if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,120)}else go()}
$('les').innerHTML=L.map((s,i)=>`<details${i?'':' open'}><summary>${s.t}</summary><div class="body"><p class="note">${s.n}</p>${s.r.map(r=>`<div class="row">${can?`<button class="sp" data-z="${r[2]}" aria-label="Ascolta">🔊</button>`:''}<div class="tx"><span class="py">${cp(r[1])}</span><span class="it">${r[0]}</span></div></div>`).join('')}</div></details>`).join('');
$('les').onclick=e=>{const b=e.target.closest('.sp');if(b)say(b.dataset.z)};
// flashcards
const ALL=L.flatMap(s=>s.r.map(r=>({id:s.id,it:r[0],py:r[1],zh:r[2],k:r[1]})));
let known=new Set();try{known=new Set(JSON.parse(localStorage.getItem('cn-known')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('cn-known',JSON.stringify([...known]))}catch(e){}};
let deck=[],i=0,flip=false,rev=false;
$('deck').innerHTML='<option value="all">Tutte le carte</option><option value="rep">Da ripassare</option>'+L.map(s=>`<option value="${s.id}">${s.t}</option>`).join('');
function build(){const v=$('deck').value;deck=ALL.filter(c=>v==='all'||(v==='rep'?!known.has(c.k):c.id===v));i=0;flip=false;draw()}
function draw(){$('res').textContent='';
 if(!deck.length){$('card').innerHTML='<span class="big">Nessuna carta</span><span class="hint">Scegli un altro mazzo</span>';$('stat').textContent='';return}
 const c=deck[i],front=rev?`<span class="big">${cp(c.py)}</span>`:`<span class="big">${c.it}</span>`,back=rev?`<span class="big">${c.it}</span>`:`<span class="big">${cp(c.py)}</span>`;
 $('card').innerHTML=flip?back+`<span class="hint">${c.zh}</span>`:front+'<span class="hint">Tocca per girare</span>';
 $('stat').textContent=`Carta ${i+1} di ${deck.length} · sapute in totale: ${known.size} su ${ALL.length}`}
const next=()=>{if(!deck.length)return;i=(i+1)%deck.length;flip=false;draw()};
$('card').onclick=()=>{if(!deck.length)return;flip=!flip;draw();if(flip&&!rev)say(deck[i].zh)};
$('listen').onclick=()=>deck.length&&say(deck[i].zh);
$('yes').onclick=()=>{if(deck.length){known.add(deck[i].k);save();next()}};
$('no').onclick=()=>{if(deck.length){known.delete(deck[i].k);save();next()}};
$('shuf').onclick=()=>{for(let j=deck.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}i=0;flip=false;draw()};
$('dir').onclick=()=>{rev=!rev;$('dir').textContent=rev?'Cinese → Italiano':'Italiano → Cinese';flip=false;draw()};
$('deck').onchange=build;
if(!can)$('listen').hidden=true;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
async function recPlay(c,why){const res=$('res');
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),m=new MediaRecorder(s),ch=[];
 m.ondataavailable=e=>ch.push(e.data);
 m.onstop=()=>{s.getTracks().forEach(t=>t.stop());const a=new Audio(URL.createObjectURL(new Blob(ch)));res.textContent='Ascolta la tua voce, poi quella modello: confrontale.';a.onended=()=>say(c.zh);a.play()};
 res.textContent=(why?'Controllo automatico non disponibile ('+why+'). ':'')+'🎤 Registro per 4 secondi: di\' «'+c.py+'»';m.start();setTimeout(()=>m.stop(),4000)}
 catch(x){res.textContent='Il microfono è bloccato ('+(x&&x.name||'errore')+'). Su iPhone: Impostazioni → il tuo browser → Microfono, oppure in Safari tocca aA → Impostazioni sito web → Microfono.'}}
const hz=s=>s.replace(/[^\u4e00-\u9fff]/g,'');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
$('mic').onclick=()=>{
 if(!deck.length)return;const c=deck[i],t=hz(c.zh),res=$('res');
 if(!SR){recPlay(c);return}
 let done=0;const r=new SR();r.lang='zh-CN';r.maxAlternatives=5;r.interimResults=false;
 res.textContent='🎤 Ti ascolto… di\' «'+c.py+'»';
 r.onresult=e=>{done=1;
  const alts=[...e.results[0]].map(a=>hz(a.transcript)).filter(Boolean);
  if(!alts.length){res.textContent='Non ho sentito nulla di chiaro. Riprova.';return}
  let best=alts[0],sc=-1;for(const a of alts){const s=1-lev(a,t)/Math.max(a.length,t.length);if(s>sc){sc=s;best=a}}
  const diff=[...best].map((ch,k)=>ch===t[k]?ch:`<b class="t4">${ch}</b>`).join('');
  res.innerHTML=sc>=1?'✅ Perfetto: ti ha capito esattamente.'
   :sc>=.6?`🟡 Quasi. Ha sentito «${diff}» invece di «${t}». Le sillabe in rosso sono diverse: controlla i toni e riprova.`
   :`🔴 Non è stato riconosciuto. Ha sentito «${best}». Premi 🔊, ascolta e ripeti più lentamente.`};
 r.onerror=e=>{done=1;if(['not-allowed','service-not-allowed','aborted','audio-capture','language-not-supported'].includes(e.error)){recPlay(c,e.error);return}res.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'Microfono non consentito: attivalo nelle impostazioni del browser.':e.error==='no-speech'?'Non ho sentito nulla. Riprova.':e.error==='aborted'?'Interrotto. Se è apparsa la richiesta del microfono, scegli «Consenti» e premi di nuovo 🎤.':'Riconoscimento non disponibile ('+e.error+').'};
 r.onend=()=>{if(!done)res.textContent='Non ho sentito nulla. Premi 🎤 e parla subito.'};
 try{speechSynthesis&&speechSynthesis.cancel();r.start()}catch(x){res.textContent='Impossibile avviare il microfono.'}};
function tab(f){$('les').hidden=f;$('fla').hidden=!f;$('tl').setAttribute('aria-selected',!f);$('tf').setAttribute('aria-selected',f);if(f)build()}
$('tl').onclick=()=>tab(false);$('tf').onclick=()=>tab(true);
</script></main></body></html>
